# A Shade Tree node, the compose way. Same image and knobs as `docker run`; see docs/OPERATOR.md.
#
#   docker compose up -d
#   docker compose exec shadenet-node shadenet-node status
#   docker compose stop                 # retire: the node leaves every Elder within 15 minutes
services:
  shadenet-node:
    image: ghcr.io/dmarzzz/shadenet-node:0.7.5
    container_name: shadenet-node
    restart: unless-stopped
    environment:
      SHADENET_RECORD: https://raw.githubusercontent.com/dmarzzz/shade-tree-node/main/network/sepolia/deployment.json
      # Optional knobs (defaults shown). Put secrets in files, never here.
      # SHADENET_ADMIT: staked
      # SHADENET_ALLOW: "*:443"
      # SHADENET_DENY: ""
      # SHADENET_PROFILE: home       # a residential connection: weight 10, conns 32, sessions 4, bandwidth 2m, canary on (docs/HOME-NODE.md)
      # SHADENET_WEIGHT: "100"
      # SHADENET_CONNS: "1024"
      # SHADENET_SESSIONS: "256"
      # SHADENET_BANDWIDTH: "2m"      # bytes per second across every tunnel; unset = unlimited
      # SHADENET_DENY_FILE: /blocklists/hosts.txt   # hosts-format blocklist, mounted read-only
      # SHADENET_CANARY: "on"
      # SHADENET_REGION: eu
      # SHADENET_METRICS: "9101"
      # SHADENET_LOG: json:info
      # SHADENET_OPERATOR_KEY_FILE: /run/secrets/operator-key
    volumes:
      - shadenet-node:/state
    # secrets:
    #   - operator-key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g, pids: 256 }

# secrets:
#   operator-key:
#     file: ./operator.key   # one line, 64 hex, chmod 600

volumes:
  shadenet-node:
