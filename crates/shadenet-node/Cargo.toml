[package]
name = "shadenet-node"
version = "0.7.5"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "ShadeNet node: the `shadenet-node` binary, a proof-gated Tor egress node (ADR 0014)"
repository = "https://github.com/dmarzzz/shade-tree-node"
publish = false

[lib]
name = "shadenet_node"
path = "src/lib.rs"

[[bin]]
name = "shadenet-node"
path = "src/main.rs"

[dependencies]
shadenet-proto = { path = "../shadenet-proto", version = "0.7.5" }
shadenet = { path = "../shadenet", version = "0.7.5", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "signal"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "json", "std"] }
